<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Picture of Dorian Gray</title>
  <meta name="description" content="Sit for your portrait. Then watch it pay for your sins.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://doriangray.milettegillow.com">
  <meta property="og:title" content="The Picture of Dorian Gray">
  <meta property="og:description" content="Sit for your portrait. Then watch it pay for your sins.">
  <meta property="og:image" content="https://doriangray.milettegillow.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Picture of Dorian Gray">
  <meta name="twitter:description" content="Sit for your portrait. Then watch it pay for your sins.">
  <meta name="twitter:image" content="https://doriangray.milettegillow.com/og-image.jpg">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page is-landing" id="page">
    <h1 class="title">The Picture of Dorian Gray</h1>

    <section class="landing" id="landing">
      <p class="refusal" id="refusal" hidden></p>
      <button class="btn btn-primary" id="sit" type="button">Sit for your portrait</button>
      <input type="file" id="file" accept="image/*" hidden>
      <p class="privacy" id="privacy">Your photo is sent to Google Gemini to paint your portrait and is never stored.</p>
    </section>

    <section class="studio" id="studio" hidden>
      <div class="stage">
        <div class="frame-wrap" id="frame-wrap">
          <div class="opening">
            <img class="portrait" id="portrait" alt="Your portrait">
            <img class="slash" id="slash" src="placeholders/slash-overlay.png" alt="">
            <img class="cloth" id="cloth" src="placeholders/curtain.jpeg" alt="">
          </div>
          <img class="frame" src="placeholders/baroque-frame.png" alt="">
          <figure class="polaroid" id="polaroid">
            <img id="stranger" alt="A withered, loathsome stranger">
          </figure>
        </div>
      </div>

      <div class="panel">
        <p class="narration" id="narration" aria-live="polite"></p>

        <div class="actions">
          <div class="action-row">
            <button class="btn btn-primary" id="next" type="button" hidden></button>
            <button class="btn btn-primary" id="restart" type="button" hidden>Start again</button>
            <button class="btn btn-secondary" id="download" type="button" hidden>Download portrait</button>
          </div>
          <button class="btn btn-quiet" id="undo" type="button" hidden>Undo</button>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
